name: Build Android APK

# Manual only — this isn't part of the normal web app CI, it's a way to
# produce an installable .apk of one of the WebView wrapper apps on demand
# (this sandbox can't build Android apps itself; dl.google.com is blocked
# by its egress policy). Each app publishes to its own apk-builds-* branch
# rather than as a workflow artifact so it can be fetched with a plain
# git pull instead of an authenticated API call.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to build"
        type: choice
        options:
          - customer
          - sales
        default: sales

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Resolve which project/branch/filename this app maps to
        id: meta
        run: |
          case "${{ inputs.app }}" in
            customer)
              echo "dir=apps/android" >> "$GITHUB_OUTPUT"
              echo "apk_name=wasla-customer.apk" >> "$GITHUB_OUTPUT"
              echo "branch=apk-builds" >> "$GITHUB_OUTPUT"
              ;;
            sales)
              echo "dir=apps/android-sales" >> "$GITHUB_OUTPUT"
              echo "apk_name=wasla-sales.apk" >> "$GITHUB_OUTPUT"
              echo "branch=apk-builds-sales" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown app: ${{ inputs.app }}" >&2
              exit 1
              ;;
          esac

      - name: Write google-services.json (push notifications, customer app only)
        if: inputs.app == 'customer' && secrets.GOOGLE_SERVICES_JSON_CUSTOMER != ''
        env:
          GOOGLE_SERVICES_JSON_CUSTOMER: ${{ secrets.GOOGLE_SERVICES_JSON_CUSTOMER }}
        run: echo "$GOOGLE_SERVICES_JSON_CUSTOMER" > apps/android/app/google-services.json

      - name: Build debug APK
        working-directory: ${{ steps.meta.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Publish APK to its builds branch
        run: |
          set -e
          APK_PATH=$(find "${{ steps.meta.outputs.dir }}" -name "*.apk" | head -n1)
          echo "Built: $APK_PATH"
          mkdir -p /tmp/apk-out
          cp "$APK_PATH" "/tmp/apk-out/${{ steps.meta.outputs.apk_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="${{ steps.meta.outputs.branch }}"
          git fetch origin "$BRANCH" 2>/dev/null || true
          if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout --orphan "$BRANCH"
          fi
          git rm -rf . >/dev/null 2>&1 || true
          cp "/tmp/apk-out/${{ steps.meta.outputs.apk_name }}" .
          git add "${{ steps.meta.outputs.apk_name }}"
          git commit -m "Build ${{ steps.meta.outputs.apk_name }} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push origin "$BRANCH" --force
